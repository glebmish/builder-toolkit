name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (PR head or branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: preflight.test.sh (${{ matrix.os }})
    # The hook is documented as bash 3.2 compatible. macOS system bash is 3.2;
    # ubuntu runners ship bash 5+. Running both catches regressions in either direction.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Verify jq present (macOS)
        if: runner.os == 'macOS'
        # macOS runners ship jq pre-installed; assert rather than reinstall.
        run: jq --version

      - name: Show bash version
        run: bash --version

      - name: Run preflight hook tests
        run: bash plugins/git-history-rewrite/tests/git-history-rewrite/preflight.test.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Lint hook and tests
        # -x follows sourced files. Discovered rather than listed, for the
        # same drift reason as the manifest job below.
        run: |
          set -eu
          found=$(find plugins -name '*.sh' | sort)
          if [ -z "$found" ]; then
            echo "::error::no shell scripts found — has the layout changed?"
            exit 1
          fi
          echo "$found"
          # shellcheck disable=SC2086
          shellcheck -x $found

  go-snippets:
    name: Go snippets (format + parse)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Check formatting and syntax
        # The snippets under agent-cli are reference material users copy,
        # not a buildable module: there is no go.mod, they import a
        # deliberately fictional module path, schema.go embeds a spec file
        # that only exists in a real project, and the per-resource command
        # files are not shipped. So `go build` / `go vet` cannot run here.
        #
        # gofmt still can, and it parses: it catches the failure that
        # actually matters — a snippet with a syntax error becoming code
        # somebody pastes. Anything deeper needs the module assembled, and
        # that harness is deliberately not maintained in this repo.
        run: |
          set -eu
          dir=plugins/agent-cli/skills/agent-cli-implement/snippets
          echo "==> gofmt -l $dir"
          unformatted=$(gofmt -l "$dir")
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "==> parse check"
          fail=0
          while IFS= read -r f; do
            if ! gofmt -e "$f" >/dev/null; then
              echo "::error file=$f::does not parse"
              fail=1
            fi
          done < <(find "$dir" -name '*.go')
          exit "$fail"

  manifests:
    name: JSON manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate JSON syntax
        # Claude Code's plugin manifest schema is not published as a public JSON
        # Schema, so we limit ourselves to syntactic validation here. Upgrade to
        # schema validation if/when Anthropic ships one.
        run: |
          set -eu
          # Discovered, not listed: a hardcoded list silently stops
          # covering the next plugin somebody adds.
          count=0
          for f in .claude-plugin/marketplace.json \
                   $(find plugins -name plugin.json -path '*/.claude-plugin/*' | sort)
          do
            echo "==> $f"
            jq empty "$f"
            count=$((count + 1))
          done
          if [ "$count" -lt 2 ]; then
            echo "::error::only $count manifest(s) found — has the layout changed?"
            exit 1
          fi
          echo "validated $count manifests"

      - name: marketplace.json lists exactly the plugins on disk
        # The likelier drift is not malformed JSON, it is adding a plugin
        # directory and forgetting to register it (or vice versa).
        run: |
          set -eu
          listed=$(jq -r '.plugins[].source' .claude-plugin/marketplace.json | sed 's|^\./||' | sort)
          onfs=$(find plugins -mindepth 1 -maxdepth 1 -type d | sort)
          if ! diff <(echo "$listed") <(echo "$onfs"); then
            echo "::error::marketplace.json plugins[] and plugins/ have drifted (< listed, > on disk)"
            exit 1
          fi
          echo "marketplace.json matches plugins/ on disk"

      - name: plugin.json name matches its directory
        run: |
          set -eu
          fail=0
          while IFS= read -r m; do
            dir=$(basename "$(dirname "$(dirname "$m")")")
            name=$(jq -r '.name' "$m")
            if [ "$dir" != "$name" ]; then
              echo "::error::$m declares name=$name but lives in plugins/$dir"
              fail=1
            fi
          done < <(find plugins -path '*/.claude-plugin/plugin.json')
          exit "$fail"
